      employees: d.emp.filter(e => e.dept === dept && e.active).sort((a,b)=>a.sort-b.sort).map(e => e.name),
      recent: d.inbox.filter(r => r.job_ticket === w.job_ticket && r.dept === dept).sort((a,b)=>b.scanned_at.localeCompare(a.scanned_at)).slice(0,8)
        .map(r => ({employee_name:r.employee_name, step:r.step, status:r.status, qty:r.qty, at:r.scanned_at, review_status:r.review_status}))};
  },
  async submitScan(p){
    const d = this.db(), w = d.wo.find(x => x.job_ticket === p.job.trim());
    if (!w) throw new Error('ไม่พบเลขที่ JOB ' + p.job);
    if (w.closed) throw new Error('JOB ' + w.job_ticket + ' ปิดแล้ว ติดต่อออฟฟิศ');
    const warns = [], now = Date.now();
    if (d.inbox.some(r => r.job_ticket===w.job_ticket && r.dept===p.dept && r.employee_name===p.employee && r.status===p.status && (r.step||'')===(p.step||'') && r.review_status!=='rejected' && now - new Date(r.scanned_at) < 600000))
      warns.push('สแกนซ้ำภายใน 10 นาที');
    if (p.qty && w.order_qty > 0) {
      const logs = p.dept === 'prod' ? d.prod_logs.filter(l => l.job_ticket===w.job_ticket && l.step===p.step) : d.qc_logs.filter(l => l.job_ticket===w.job_ticket);
      const pend = d.inbox.filter(r => r.job_ticket===w.job_ticket && r.dept===p.dept && r.review_status==='pending' && (p.dept==='qc' || r.step===p.step));
      const total = [...logs, ...pend].reduce((s,r) => s + (+r.qty||0), 0);
      if (total + p.qty > w.order_qty * 1.2) warns.push(`ยอดรวม ${fmtN(total+p.qty)} เกินยอดสั่ง ${fmtN(w.order_qty)} เกิน 20%`);
    }
    const row = {id: ++d.seq, dept:p.dept, job_ticket:w.job_ticket, employee_name:p.employee, step:p.step||null, status:p.status, qty:p.qty, note:p.note||null,
      scanned_at:new Date().toISOString(), device_id:p.device, warnings:warns, review_status:'pending'};
    d.inbox.push(row); this.save();
    return {id: row.id, warnings: warns};
  },
  async session(){ return {email:'ทดลอง@vpack'}; },
  async listInbox(view){
    const d = this.db();
    let rows = d.inbox.filter(r => view === 'pending' ? r.review_status === 'pending' : r.review_status !== 'pending');
    rows = rows.sort((a,b) => (view==='pending' ? a.scanned_at.localeCompare(b.scanned_at) : (b.reviewed_at||'').localeCompare(a.reviewed_at||''))).slice(0, 300);
    return rows.map(r => ({...r, work_orders: d.wo.find(w => w.job_ticket === r.job_ticket)}));
  },
  async updateInbox(id, f){ const r = this.db().inbox.find(x => x.id === id); Object.assign(r, f); this.save(); },
  async approve(ids){
    const d = this.db(); let n = 0;
    d.inbox.filter(r => ids.includes(r.id) && r.review_status === 'pending').forEach(r => {
      const log = {id:++d.seq, inbox_id:r.id, job_ticket:r.job_ticket, employee_name:r.employee_name, status:r.status, qty:r.qty, note:r.note, logged_at:r.scanned_at};
      if (r.dept === 'prod') d.prod_logs.push({...log, step:r.step}); else d.qc_logs.push(log);
      r.review_status = 'approved'; r.reviewed_at = new Date().toISOString(); r.reviewed_by = 'ทดลอง'; n++;
    });
    this.save(); return n;
  },
  async reject(ids, note){
    const d = this.db(); let n = 0;
    d.inbox.filter(r => ids.includes(r.id) && r.review_status === 'pending').forEach(r => { r.review_status='rejected'; r.review_note=note; r.reviewed_at=new Date().toISOString(); r.reviewed_by='ทดลอง'; n++; });
    this.save(); return n;
  },
  async progress(){
    const d = this.db();
    return d.wo.map(w => {
      const pl = d.prod_logs.filter(l => l.job_ticket === w.job_ticket).sort((a,b)=>b.logged_at.localeCompare(a.logged_at));
      const ql = d.qc_logs.filter(l => l.job_ticket === w.job_ticket).sort((a,b)=>b.logged_at.localeCompare(a.logged_at));
      const sum = (arr, f) => arr.filter(f).reduce((s,l) => s + (+l.qty||0), 0);
      return {...w,
        print_qty: sum(pl, l => l.step==='พิมพ์' && l.status!=='กำลังทำ'),
        diecut_qty: sum(pl, l => l.step==='ไดคัท' && l.status!=='กำลังทำ'),
        last_prod_status: pl[0] ? `${pl[0].step} · ${pl[0].status}` : null, last_prod_at: pl[0]?.logged_at,
        qc_qty: sum(ql, l => l.status!=='กำลังทำ'), last_qc_status: ql[0]?.status, last_qc_at: ql[0]?.logged_at,
        pending_scans: d.inbox.filter(r => r.job_ticket===w.job_ticket && r.review_status==='pending').length};
    }).sort((a,b) => b.job_ticket.localeCompare(a.job_ticket));
  },
  async nextJobTicket(){
    const d = new Date(Date.now()+7*3600e3), pfx = String((d.getUTCFullYear()+543)%100).padStart(2,'0') + String(d.getUTCMonth()+1).padStart(2,'0') + '/';
    const n = Math.max(0, ...this.db().wo.map(w => w.job_ticket).filter(j => new RegExp('^' + pfx.replace('/','\\/') + '\\d+$').test(j)).map(j => +j.split('/')[1])) + 1;
    return pfx + String(n).padStart(2,'0');
  },
  async createWorkOrder(p, mode, base){
    const d = this.db(); let j;
    if (mode === 'revise') { const b = base.replace(/-R\d+$/,''); let n = 1; while (d.wo.some(w => w.job_ticket === `${b}-R${n}`)) n++; j = `${b}-R${n}`; }
    else j = await this.nextJobTicket();
    d.wo.push({...p, job_ticket:j, closed:false, created_at:new Date().toISOString()}); this.save(); return j;
  },
  async updateWorkOrder(job, p){ const w = this.db().wo.find(x => x.job_ticket === job); Object.assign(w, p); this.save(); },
  async rememberMasters(p, L){ const m = this.m();
    if (p.customer_name && !L.customers.includes(p.customer_name)) m.customers.push({code:'C-'+Date.now(), short_name:p.customer_name, name:p.customer_name});
    if (p.product_code && !L.products.some(([c]) => c === p.product_code)) m.products.push({code:p.product_code, name:p.product_name, short_name:p.product_name});
    if (p.paper_code && !L.raw.some(r => r.code === p.paper_code)) m.raw_materials.push({code:p.paper_code, name:p.paper_name, paper_type:p.paper_type, supplier:p.supplier});
    this.save(); },
  m(){ const d = this.db(); if (!d.m) { const L = DEMO_LOOKUPS;
      d.m = { customers: L.customers.map((n,i) => ({code:'C'+(i+1), short_name:n, name:n})),
        products: L.products.map(([code,name]) => ({code, name, short_name:name})),
        raw_materials: L.raw.map(r => ({...r, item_type:'วัตถุดิบ'})),
        suppliers: L.suppliers.map((n,i) => ({code:'S'+(i+1), short_name:n, name:n})),
        lookups: Object.entries(L.spec).flatMap(([c,vals]) => vals.map((value,sort) => ({category:c, value, sort}))) }; this.save(); }
    return d.m; },
  async lookups(){ const m = this.m(), spec = {};
    [...m.lookups].sort((a,b) => a.sort - b.sort).forEach(x => (spec[x.category] ||= []).push(x.value));
    return { customers: [...new Set(m.customers.map(x => x.short_name))].sort(), products: m.products.map(x => [x.code, x.name]),
      raw: m.raw_materials, suppliers: [...new Set(m.suppliers.map(x => x.short_name))].sort(), spec }; },
  async masterList(t, M, q){ q = (q||'').toLowerCase();
    const rows = this.m()[t].filter(r => !q || M.search.some(c => String(r[c]||'').toLowerCase().includes(q))).sort((a,b) => String(a[M.key]).localeCompare(String(b[M.key])));
    return { rows: rows.slice(0,100), more: rows.length > 100 }; },
  async masterSave(t, key, o, orig){ const arr = this.m()[t];
    if (arr.some(r => r[key] === o[key] && r[key] !== orig)) throw new Error('duplicate');
    if (orig === null) arr.push(o); else Object.assign(arr.find(r => r[key] === orig), o); this.save(); },
  async masterDelete(t, key, k){ const m = this.m(); m[t] = m[t].filter(r => r[key] !== k); this.save(); },
  async specList(cat){ return this.m().lookups.filter(x => x.category === cat).sort((a,b) => a.sort - b.sort); },
  async specSave(cat, value, orig, sort){ const m = this.m();
    if (orig === null) { if (m.lookups.some(x => x.category === cat && x.value === value)) throw new Error('duplicate'); m.lookups.push({category:cat, value, sort}); }
    else Object.assign(m.lookups.find(x => x.category === cat && x.value === orig), {value, sort}); this.save(); },
  async specDelete(cat, value){ const m = this.m(); m.lookups = m.lookups.filter(x => !(x.category === cat && x.value === value)); this.save(); },
  async getWorkOrder(job){ return this.db().wo.find(w => w.job_ticket === job.trim()) || null; },
  async searchJobs(s){ s = (s||'').toLowerCase(); return this.db().wo.filter(w => !s || (w.job_ticket+w.customer_name+w.product_name).toLowerCase().includes(s)).slice(0,30); },
  async employees(){ return [...this.db().emp].sort((a,b)=>a.sort-b.sort); },
  async addEmployee(name, dept){ const d = this.db(); d.emp.push({id:++d.seq, name, dept, active:true, sort:d.emp.length}); this.save(); },
  async toggleEmployee(id, active){ this.db().emp.find(e => e.id === id).active = active; this.save(); }
};

/* ================== Supabase backend ================== */
const Live = {
  sb: null,
  init(){ this.sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); },
  chk({data, error}){ if (error) throw new Error(error.message); return data; },
  async getJob(job, dept){ return this.chk(await this.sb.rpc('get_job_for_scan', {p_job: job, p_dept: dept})); },
  async submitScan(p){
    return this.chk(await this.sb.rpc('submit_scan', {p_dept:p.dept, p_job:p.job, p_employee:p.employee, p_step:p.step||'', p_status:p.status, p_qty:p.qty, p_note:p.note||'', p_device:p.device}));
  },
  async session(){ const {data} = await this.sb.auth.getSession(); return data.session ? {email: data.session.user.email} : null; },
  async login(email, password){ this.chk(await this.sb.auth.signInWithPassword({email, password})); },
  async logout(){ await this.sb.auth.signOut(); },
  async listInbox(view){
    let q = this.sb.from('scan_inbox').select('*, work_orders(customer_name, product_name, order_qty)');
    q = view === 'pending' ? q.eq('review_status','pending').order('scanned_at', {ascending:true})
                           : q.neq('review_status','pending').order('reviewed_at', {ascending:false});
    return this.chk(await q.limit(300));
  },
  async updateInbox(id, f){ this.chk(await this.sb.from('scan_inbox').update(f).eq('id', id).eq('review_status','pending')); },
  async approve(ids){ return this.chk(await this.sb.rpc('approve_scans', {p_ids: ids})); },
  async reject(ids, note){ return this.chk(await this.sb.rpc('reject_scans', {p_ids: ids, p_note: note})); },
  async progress(s, hideClosed){
    let q = this.sb.from('v_job_progress').select('*').order('job_ticket', {ascending:false}).limit(300);
    if (hideClosed) q = q.eq('closed', false);
    s = (s||'').replace(/[,()%]/g, ' ').trim();
    if (s) q = q.or(`job_ticket.ilike.%${s}%,customer_name.ilike.%${s}%,product_name.ilike.%${s}%`);
    return this.chk(await q);
  },
  async fetchAll(table, cols, order){
    const out = []; for (let from = 0; ; from += 1000) {
      const rows = this.chk(await this.sb.from(table).select(cols).order(order).range(from, from + 999));
      out.push(...rows); if (rows.length < 1000) break; } return out; },
  async lookups(){
    const [c, p, r, s, l] = await Promise.all([
      this.fetchAll('customers','short_name','short_name'), this.fetchAll('products','code,name','code'),
      this.fetchAll('raw_materials','code,name,paper_type,supplier,width_mm','code'), this.fetchAll('suppliers','short_name','short_name'),
      this.fetchAll('lookups','category,value,sort','sort')]);
    const spec = {}; l.forEach(x => (spec[x.category] ||= []).push(x.value));
    return { customers: [...new Set(c.map(x => x.short_name))], products: p.map(x => [x.code, x.name]), raw: r, suppliers: [...new Set(s.map(x => x.short_name).filter(Boolean))], spec };
  },
  async masterList(t, M, q){
    let x = this.sb.from(t).select('*').order(M.key).limit(101);
    q = (q||'').replace(/[,()%]/g, ' ').trim();
    if (q) x = x.or(M.search.map(c => `${c}.ilike.%${q}%`).join(','));
    const rows = this.chk(await x); return { rows: rows.slice(0,100), more: rows.length > 100 };
  },
  async masterSave(t, key, o, origKey){
    if (origKey === null) this.chk(await this.sb.from(t).insert(o));
    else this.chk(await this.sb.from(t).update(o).eq(key, origKey));
  },
  async masterDelete(t, key, k){ this.chk(await this.sb.from(t).delete().eq(key, k)); },
  async specList(cat){ return this.chk(await this.sb.from('lookups').select('*').eq('category', cat).order('sort').order('value')); },
  async specSave(cat, value, orig, sort){
    if (orig === null) this.chk(await this.sb.from('lookups').insert({category: cat, value, sort}));
    else this.chk(await this.sb.from('lookups').update({value, sort}).eq('category', cat).eq('value', orig));
  },
  async specDelete(cat, value){ this.chk(await this.sb.from('lookups').delete().eq('category', cat).eq('value', value)); },
  async nextJobTicket(){ return this.chk(await this.sb.rpc('next_job_ticket')); },
  async createWorkOrder(p, mode, base){ return this.chk(await this.sb.rpc('create_work_order', {p, p_mode: mode, p_base: base || null})); },
  async updateWorkOrder(job, p){ this.chk(await this.sb.from('work_orders').update(p).eq('job_ticket', job)); },
  async rememberMasters(p, L){   // รหัสงาน/ลูกค้า/กระดาษใหม่ที่ยังไม่มีในข้อมูลหลัก → เพิ่มให้อัตโนมัติ
    try {
      if (p.product_code && !L.products.some(([c]) => c === p.product_code)) await this.sb.from('products').insert({code: p.product_code, name: p.product_name, short_name: p.product_name});
      if (p.customer_name && !L.customers.includes(p.customer_name)) await this.sb.from('customers').insert({code: 'NEW-' + Date.now(), short_name: p.customer_name, name: p.customer_name});
      if (p.paper_code && !L.raw.some(r => r.code === p.paper_code)) await this.sb.from('raw_materials').insert({code: p.paper_code, name: p.paper_name, paper_type: p.paper_type, supplier: p.supplier});
    } catch {}
  },
  async getWorkOrder(job){ return this.chk(await this.sb.from('work_orders').select('*').eq('job_ticket', job.trim()).maybeSingle()); },
  async searchJobs(s){
    s = (s||'').replace(/[,()%]/g, ' ').trim();
    let q = this.sb.from('work_orders').select('job_ticket, customer_name, product_name, order_qty').order('job_ticket', {ascending:false}).limit(30);
    if (s) q = q.or(`job_ticket.ilike.%${s}%,customer_name.ilike.%${s}%,product_name.ilike.%${s}%`);
    return this.chk(await q);
  },
  async employees(){ return this.chk(await this.sb.from('employees').select('*').order('sort').order('name')); },
  async addEmployee(name, dept){ this.chk(await this.sb.from('employees').insert({name, dept, sort: 99})); },
  async toggleEmployee(id, active){ this.chk(await this.sb.from('employees').update({active}).eq('id', id)); }
};

const params = new URLSearchParams(location.search);
const scanDept = params.get('scan');

async function renderScan(dept, job){
  const D = DEPT[dept];
  document.documentElement.style.setProperty('--accent', `var(--${dept})`);
  document.documentElement.style.setProperty('--accent-soft', `var(--${dept}-soft)`);
  document.title = `${D.title} · JOB Tracking`;
  const app = $('#app');
  const head = `<div class="scan-head"><div class="brand">V-PACK · JOB Tracking</div><h1>${esc(D.title)}</h1></div>`;

  if (!job) {
    app.innerHTML = `<div class="scan-wrap">${head}
      <div class="jobcard"><div style="font-size:15px;margin-bottom:10px">พิมพ์เลขที่ JOB (กรณีสแกน QR ไม่ได้)</div>
      <input id="manualJob" class="field" placeholder="เช่น 6910/49" inputmode="text" autocomplete="off">

  }

  app.innerHTML = `<div class="scan-wrap">${head}<div class="jobcard">กำลังโหลด…</div></div>`;
  let info;
  try { info = await API.getJob(job, dept); }
  catch (e) { app.innerHTML = `<div class="scan-wrap">${head}<div class="err">โหลดข้อมูลไม่ได้: ${esc(e.message)}<br>ลองตรวจอินเทอร์เน็ตแล้วสแกนใหม่</div></div>`; return; }

    app.innerHTML = `<div class="scan-wrap">${head}<div class="err">ไม่พบเลขที่ JOB <b>${esc(job)}</b> ในระบบ แจ้งออฟฟิศ หรือพิมพ์เลขใหม่</div>
      <div class="sec"><input id="manualJob" class="field" value="${esc(job)}"><button class="btn block" style="margin-top:10px" id="goJob">ค้นหาอีกครั้ง</button></div></div>`;

      <div class="jobno">${esc(info.job_ticket)}</div>
      <div class="cust">${esc(info.customer_name)}</div>
      <div class="prod">${esc(info.product_name)}</div>
      <div class="meta"><span>ยอดสั่งผลิต <b>${fmtN(info.order_qty)}</b></span>${info.machine ? `<span>เครื่อง <b>${esc(info.machine)}</b></span>` : ''}${info.due_date ? `<span>กำหนดส่ง <b>${fmtD(info.due_date)}</b></span>` : ''}</div>
    </div>
    ${info.closed ? `<div class="err">JOB นี้ปิดแล้ว บันทึกเพิ่มไม่ได้ ติดต่อออฟฟิศ</div>` : `
    <div class="sec"><h2>${num()} ชื่อ${dept==='prod'?'ช่างฝ่ายผลิต':'พนักงาน QC'} <span class="req">*</span></h2>
      <div class="chips" id="empChips">${info.employees.map(e => `<button class="chip" data-v="${esc(e)}">${esc(e)}</button>`).join('')}<button class="chip" data-v="__other">อื่นๆ</button></div>
      <input id="otherName" class="field hidden" style="margin-top:8px" placeholder="พิมพ์ชื่อ">
    </div>
    ${dept === 'prod' ? `<div class="sec"><h2>${num()} ขั้นตอนการทำงาน <span class="req">*</span></h2>

    $('#otherName').classList.toggle('hidden', st.employee !== '__other');
    document.querySelectorAll('#stepChips .chip').forEach(c => c.classList.toggle('on', c.dataset.v === st.step));
    document.querySelectorAll('#stChips .chip').forEach(c => c.classList.toggle('on', c.dataset.v === st.status));
    $('#qtySec').classList.toggle('hidden', !needQty());
    const name = st.employee === '__other' ? st.other.trim() : st.employee;
    const qtyOk = !needQty() || (+st.qty > 0);
    $('#submit').disabled = !(name && st.status && qtyOk && (dept !== 'prod' || st.step));
    const hint = $('#qtyHint');
    if (needQty() && +st.qty > 0 && info.order_qty) hint.textContent = `= ${(st.qty / info.order_qty * 100).toFixed(0)}% ของยอดสั่ง ${fmtN(info.order_qty)}`;
    else hint.textContent = '';
  };
  const bind = (sel, key) => document.querySelectorAll(sel + ' .chip').forEach(c => c.onclick = () => { st[key] = c.dataset.v; refresh(); if (key==='status' && needQty()) setTimeout(() => $('#qty').focus(), 50); });
  bind('#empChips', 'employee'); bind('#stepChips', 'step'); bind('#stChips', 'status');
  $('#otherName').oninput = e => { st.other = e.target.value; refresh(); };
  $('#qty').oninput = e => { const v = e.target.value.replace(/[^\d]/g, ''); st.qty = v; e.target.value = v ? Number(v).toLocaleString('en-US') : ''; refresh(); };
  $('#note').oninput = e => { st.note = e.target.value; };
  refresh();

  $('#submit').onclick = async () => {
    const btn = $('#submit'); btn.disabled = true; btn.textContent = 'กำลังส่ง…';
    const employee = st.employee === '__other' ? st.other.trim() : st.employee;
    const payload = { dept, job: info.job_ticket, employee, step: st.step, status: st.status, qty: needQty() ? +st.qty : null, note: st.note, device: deviceId() };
    try {
      const res = await API.submitScan(payload);
      if (st.employee !== '__other') store.set('vp_name_' + dept, employee);
      app.innerHTML = `<div class="scan-wrap">${head}<div class="done-screen">
        <div class="ic">✓</div><h2>ส่งข้อมูลแล้ว</h2><div style="color:var(--muted)">รอออฟฟิศตรวจสอบก่อนนับยอด</div>
        <div class="summary"><b>${esc(info.job_ticket)}</b> · ${esc(info.product_name)}<br>
          ${esc(employee)}${payload.step ? ' · ' + esc(payload.step) : ''}<br>
          สถานะ <b>${esc(payload.status)}</b>${payload.qty ? ` · จำนวน <b>${fmtN(payload.qty)}</b>` : ''}${payload.note ? `<br>หมายเหตุ: ${esc(payload.note)}` : ''}</div>
        ${res.warnings?.length ? `<div class="warnbox">⚠ ${res.warnings.map(esc).join('<br>⚠ ')}<br><small>ถ้าส่งผิด แจ้งออฟฟิศได้เลย ออฟฟิศจะแก้หรือยกเลิกให้</small></div>` : ''}
        <button class="btn ghost block" style="margin-top:20px" onclick="location.reload()">กลับไปหน้า JOB นี้</button>
      </div></div>`;
    } catch (e) {
      btn.disabled = false; btn.textContent = 'ส่งข้อมูล';
      toast('ส่งไม่สำเร็จ: ' + e.message);
    }
  };
}

  setVal(c, v){ this.wo[c] = v; const el = $(`#woForm [data-c="${c}"]`); if (el) { if (el.type === 'checkbox') el.checked = !!v; else el.value = v ?? ''; } },
  onChange(c){
    const w = this.wo, N = x => { const n = parseFloat(String(x ?? '').replace(/,/g,'')); return isNaN(n) ? null : n; };
    if (['order_qty','across','die_rows','repeat_mm','setup_waste_m'].includes(c)) {
      const q = N(w.order_qty), a = N(w.across), r = N(w.die_rows), rp = N(w.repeat_mm), sw = N(w.setup_waste_m) || 0;
      const per = a && r ? a * r : null;
      const rows = q !== null && per ? +(q / per).toFixed(2) : null;               // = F13/(F11*F12)
      const run  = q !== null && per && rp !== null ? +((q * rp) / per / 1000).toFixed(2) : null;  // = (F13*F15)/(F11*F12)/1000
      this.setVal('length_rows', rows); this.setVal('run_m', run);
      this.setVal('total_m', run !== null ? +(run + sw).toFixed(2) : (sw || null));  // = F20+F21
    }
    if (c === 'product_code') {
      const p = this.L.products.find(([code]) => code === (w.product_code||'').trim());
      if (p) this.setVal('product_name', p[1]);
    }
    if (c === 'paper_code') {
      const r = this.L.raw.find(x => x.code === (w.paper_code||'').trim());
      if (r) { this.setVal('paper_name', r.name);
        if (!w.paper_type && r.paper_type) this.setVal('paper_type', r.paper_type);
        if (!w.supplier && r.supplier) this.setVal('supplier', r.supplier);

  payload(){
    const o = {};

      let v = this.wo[c];
      if (t === 'boolean') v = !!v;
      else if (t === 'numeric') { const n = parseFloat(String(v ?? '').replace(/,/g,'')); v = isNaN(n) ? null : n; }
      else if (typeof v === 'string') { v = v.trim(); if (v === '') v = null; }
      o[c] = v ?? (t === 'boolean' ? false : null);

    delete o.job_ticket;
    return o;

    if (miss.length) return toast('กรุณากรอก: ' + miss.join(', '));
    const msgs = { new: 'บันทึกใบสั่งผลิตใหม่?', update: `บันทึกการแก้ไข JOB ${this.wo.job_ticket}?`, revise: `บันทึกเป็นงาน Revised ของ ${this.wo.job_ticket}?`, copy: 'สร้าง JOB ใหม่ โดยใช้ข้อมูลจากใบนี้?' };
    if ((kind === 'revise' || kind === 'copy') && !(await Office.confirm(msgs[kind]))) return;
    try {

      if (kind === 'update') { await API.updateWorkOrder(this.wo.job_ticket, p); job = this.wo.job_ticket; }
      else job = await API.createWorkOrder(p, kind === 'revise' ? 'revise' : 'new', this.wo.job_ticket);
      await API.rememberMasters?.(p, this.L);
      this.L = await API.lookups();
      toast(kind === 'update' ? `บันทึก ${job} แล้ว` : `บันทึกแล้ว ได้เลข JOB ${job}`);
      const wo = await API.getWorkOrder(job);
      this.load(wo, 'edit');
      if (andPrint) { store.set('vp_lastjob', job); Office.autoPrint = job; Office.go('qr'); }
    } catch (e) { toast('บันทึกไม่สำเร็จ: ' + e.message); }
  }
};

  draw(){
    document.querySelectorAll('#mtSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === this.t));

    const M = MASTER[this.t];

      <div class="toolbar"><input id="mtQ" class="field" style="max-width:360px;padding:9px 12px" placeholder="ค้นหา ${M.title} (รหัส / ชื่อ)" value="${esc(this.q)}">
        <div class="sp"></div><button class="btn sm" id="mtAdd">+ เพิ่ม${M.title}ใหม่</button></div>
      <div class="card tbl-wrap" id="mtList"><div class="empty">กำลังโหลด…</div></div>`;
    let tm; $('#mtQ').oninput = e => { clearTimeout(tm); tm = setTimeout(() => { this.q = e.target.value; this.load(); }, 300); };
    $('#mtAdd').onclick = () => this.edit(null);
    this.load();
  },
  async load(){
    const M = MASTER[this.t];
    try { const r = await API.masterList(this.t, M, this.q); this.rows = r.rows; this.more = r.more; }
    catch (e) { $('#mtList').innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
    const shown = M.cols.filter(c => c[2]?.list !== 0);
    $('#mtList').innerHTML = this.rows.length ? `<table><thead><tr>${shown.map(([c,l,o]) => `<th class="${o?.num?'num':''}">${l}</th>`).join('')}<th></th></tr></thead><tbody>
      ${this.rows.map((r,i) => `<tr>${shown.map(([c,l,o]) => `<td class="${o?.num?'num':''}">${o?.num ? fmtN(r[c]) : esc(r[c] ?? '')}</td>`).join('')}
        <td><div class="rowact"><button class="btn ghost sm" data-e="${i}">แก้ไข</button><button class="btn ghost sm" data-d="${i}" style="color:var(--bad)">ลบ</button></div></td></tr>`).join('')}
      </tbody></table>${this.more ? `<div class="hint" style="padding:10px 14px">แสดง 100 รายการแรก — พิมพ์ค้นหาเพื่อหาเฉพาะรายการ</div>` : ''}` : `<div class="empty">ไม่พบข้อมูล</div>`;

      const r = this.rows[+b.dataset.d];
      if (!(await Office.confirm(`ลบ ${M.title} "${r.short_name || r.name || r.code}"? (ใบสั่งผลิตเดิมที่ใช้ชื่อนี้จะไม่ถูกลบ)`))) return;
      try { await API.masterDelete(this.t, M.key, r[M.key]); WOForm.L = null; toast('ลบแล้ว'); this.load(); } catch (e) { toast('ลบไม่ได้: ' + e.message); }
    });
  },
  edit(row){
    const M = MASTER[this.t], isNew = !row;
    const r = row || Object.fromEntries(M.cols.map(([c,,o]) => [c, o?.def ?? null]));
    $('#dlgBody').innerHTML = `<h3>${isNew ? 'เพิ่ม' : 'แก้ไข'}${M.title}</h3>
      ${M.cols.map(([c,l,o]) => `<label>${l}${o?.req ? ' <span style="color:var(--bad)">*</span>' : ''}${o?.hint ? ` <small>(${o.hint})</small>` : ''}</label>
        <input class="field" data-mc="${c}" value="${esc(r[c] ?? '')}" ${o?.num ? 'inputmode="decimal"' : ''} ${o?.dl ? `list="${o.dl}"` : ''} autocomplete="off">`).join('')}
      <div class="acts"><button class="btn ghost" id="m_c">ยกเลิก</button><button class="btn" id="m_s">บันทึก</button></div>`;
    const d = $('#dlg'); d.showModal(); d.querySelector('[data-mc]').focus();
    $('#m_c').onclick = () => d.close();
    $('#m_s').onclick = async () => {
      const o = {};
      M.cols.forEach(([c,,op]) => { let v = d.querySelector(`[data-mc="${c}"]`).value.trim();
        if (op?.num) { const n = parseFloat(v.replace(/,/g,'')); v = isNaN(n) ? null : n; } else if (v === '') v = null; o[c] = v; });
      const miss = M.cols.filter(([c,,op]) => op?.req && (o[c] === null)).map(x => x[1]);
      if (miss.length) return toast('กรุณากรอก: ' + miss.join(', '));
      if (!o.code) o.code = (this.t === 'customers' ? 'C-' : this.t === 'suppliers' ? 'S-' : 'X-') + Date.now().toString(36).toUpperCase();
      try { await API.masterSave(this.t, M.key, o, isNew ? null : row[M.key]); WOForm.L = null; d.close(); toast('บันทึกแล้ว'); this.load(); }
      catch (e) { toast(/duplicate|unique/i.test(e.message) ? 'รหัสนี้มีอยู่แล้ว' : 'บันทึกไม่ได้: ' + e.message); }
    };
  },
  async drawSpec(){
    $('#mtBody').innerHTML = `<div class="spec-wrap">
      <div class="card spec-cats">${SPEC_CATS.map(([k,l]) => `<button class="spec-cat ${k===this.cat?'on':''}" data-k="${k}">${l}</button>`).join('')}</div>
      <div class="card" id="specList"><div class="empty">กำลังโหลด…</div></div></div>`;
    document.querySelectorAll('.spec-cat').forEach(b => b.onclick = () => { this.cat = b.dataset.k; this.drawSpec(); });
    let vals; try { vals = await API.specList(this.cat); } catch (e) { $('#specList').innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
    const label = SPEC_CATS.find(c => c[0] === this.cat)[1];
    $('#specList').innerHTML = `<div style="padding:14px;display:flex;gap:8px;border-bottom:1px solid var(--line)">
        <input id="specNew" class="field" style="padding:9px 12px" placeholder="เพิ่มรายการใหม่ใน ${esc(label)}"><button class="btn sm" id="specAdd">+ เพิ่ม</button></div>
      ${vals.length ? vals.map((v,i) => `<div class="emp-row"><span>${esc(v.value)}</span><span class="rowact">
        <button class="btn ghost sm" data-up="${i}" ${i===0?'disabled':''}>↑</button><button class="btn ghost sm" data-rn="${i}">แก้</button><button class="btn ghost sm" data-del="${i}" style="color:var(--bad)">ลบ</button></span></div>`).join('')
        : '<div class="empty">ยังไม่มีรายการ</div>'}
      <div class="hint" style="padding:10px 14px">รายการเหล่านี้คือตัวเลือกใน dropdown ของหน้าใบสั่งผลิต · ลบแล้วใบสั่งผลิตเดิมไม่เปลี่ยน</div>`;
    const add = async () => { const v = $('#specNew').value.trim(); if (!v) return;
      try { await API.specSave(this.cat, v, null, vals.length); WOForm.L = null; this.drawSpec(); } catch (e) { toast(/duplicate|unique/i.test(e.message) ? 'มีรายการนี้อยู่แล้ว' : e.message); } };
    $('#specAdd').onclick = add; $('#specNew').onkeydown = e => { if (e.key === 'Enter') add(); };
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { const v = vals[+b.dataset.del];
      if (!(await Office.confirm(`ลบ "${v.value}" ออกจาก ${label}?`))) return;
      await API.specDelete(this.cat, v.value); WOForm.L = null; this.drawSpec(); });
    document.querySelectorAll('[data-rn]').forEach(b => b.onclick = async () => { const v = vals[+b.dataset.rn];
      const nv = await this.ask(`แก้ไขรายการใน ${label}`, v.value); if (!nv || nv === v.value) return;
      try { await API.specSave(this.cat, nv, v.value, v.sort); WOForm.L = null; this.drawSpec(); } catch (e) { toast(e.message); } });
    document.querySelectorAll('[data-up]').forEach(b => b.onclick = async () => { const i = +b.dataset.up; if (!i) return;
      const a = vals[i-1], c = vals[i];
      await API.specSave(this.cat, c.value, c.value, i - 1); await API.specSave(this.cat, a.value, a.value, i);
      // ให้เลขลำดับต่อเนื่อง
      WOForm.L = null; this.drawSpec(); });
  },
  ask(title, val){ return new Promise(res => {
    $('#dlgBody').innerHTML = `<h3>${esc(title)}</h3><input id="a_v" class="field" value="${esc(val)}"><div class="acts"><button class="btn ghost" id="a_n">ยกเลิก</button><button class="btn" id="a_y">บันทึก</button></div>`;
    const d = $('#dlg'); d.showModal(); $('#a_v').focus(); $('#a_n').onclick = () => { d.close(); res(null); }; $('#a_y').onclick = () => { d.close(); res($('#a_v').value.trim()); };
  }); }
};

      <div class="inbox-cards">${rows.map(r => `<div class="icard">
          <div class="r1"><label style="display:flex;gap:8px;align-items:center">${pend ? `<input type="checkbox" class="sel" data-id="${r.id}" ${this.sel.has(r.id)?'checked':''}>` : ''}<b>${esc(r.job_ticket)}</b> <span class="pill ${r.dept}">${r.dept==='prod'?'ผลิต':'QC'}</span></label><span class="prodname mono">${fmtT(r.scanned_at)}</span></div>
          <div class="r2">${esc(r.employee_name)}${r.step ? ' · ' + esc(r.step) : ''} · <b>${esc(r.status)}</b>${r.qty ? ' · <b>' + fmtN(r.qty) + '</b>' : ''}
            <div class="prodname">${esc(r.work_orders?.product_name)}</div>${r.note ? `<div>📝 ${esc(r.note)}</div>` : ''}${warn(r)}</div>
          ${pend ? acts(r) : `<div style="margin-top:8px">${statusCell(r)}</div>`}</div>`).join('')}</div>`;
    box.querySelectorAll('.sel').forEach(c => c.onchange = () => { const id = +c.dataset.id; c.checked ? this.sel.add(id) : this.sel.delete(id); this.selChanged(); });
    $('#selAll')?.addEventListener('change', e => { rows.forEach(r => e.target.checked ? this.sel.add(r.id) : this.sel.delete(r.id)); this.drawInbox(); });
    box.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
      const id = +b.dataset.id;
      if (b.dataset.a === 'ok') this.doApprove([id], null);
      if (b.dataset.a === 'no') this.doReject([id]);
      if (b.dataset.a === 'edit') this.editRow(this.rows.find(r => r.id === id));
    });
    this.selChanged();
  },
  selChanged(){ const n = this.sel.size; const a = $('#approveSel'), r = $('#rejectSel'); if (!a) return;
    a.disabled = r.disabled = !n; a.textContent = n ? `อนุมัติที่เลือก (${n})` : 'อนุมัติที่เลือก'; },
  async doApprove(ids, confirmMsg){
    if (confirmMsg && !(await this.confirm(confirmMsg))) return;
    try { const n = await API.approve(ids); toast(`อนุมัติแล้ว ${n} รายการ`); ids.forEach(i => this.sel.delete(i)); this.loadInbox(); }
    catch (e) { toast('ผิดพลาด: ' + e.message); }
  },
  async doReject(ids){
    const note = await this.prompt(`ปฏิเสธ ${ids.length} รายการ`, 'เหตุผล (เช่น สแกนซ้ำ, ผิด JOB)');
    if (note === null) return;
    try { const n = await API.reject(ids, note || 'ปฏิเสธ'); toast(`ปฏิเสธแล้ว ${n} รายการ`); ids.forEach(i => this.sel.delete(i)); this.loadInbox(); }
    catch (e) { toast('ผิดพลาด: ' + e.message); }
  },
  editRow(r){
    const D = DEPT[r.dept];
    const opts = (list, v) => list.map(x => `<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
    $('#dlgBody').innerHTML = `<h3>แก้ไขรายการ ${esc(r.job_ticket)} <span class="pill ${r.dept}">${r.dept==='prod'?'ผลิต':'QC'}</span></h3>
      <label>เลขที่ JOB</label><input id="e_job" class="field" value="${esc(r.job_ticket)}">
      <label>พนักงาน</label><input id="e_emp" class="field" value="${esc(r.employee_name)}">
      ${r.dept==='prod' ? `<label>ขั้นตอน</label><select id="e_step" class="field">${opts(D.steps, r.step)}</select>` : ''}
      <label>สถานะงาน</label><select id="e_st" class="field">${opts(D.statuses, r.status)}</select>
      <label>จำนวน</label><input id="e_qty" class="field" inputmode="numeric" value="${r.qty ?? ''}">
      <label>หมายเหตุ</label><input id="e_note" class="field" value="${esc(r.note||'')}">
      <div class="acts"><button class="btn ghost" id="e_c">ยกเลิก</button><button class="btn" id="e_s">บันทึก</button><button class="btn ok" id="e_sa">บันทึก + อนุมัติ</button></div>`;
    const dlg = $('#dlg'); dlg.showModal();
    $('#e_c').onclick = () => dlg.close();
    const save = async (andApprove) => {
      const q = $('#e_qty').value.replace(/[^\d.]/g, '');
      const f = { job_ticket: $('#e_job').value.trim(), employee_name: $('#e_emp').value.trim(), status: $('#e_st').value, qty: q === '' ? null : +q, note: $('#e_note').value.trim() || null };
      if (r.dept === 'prod') f.step = $('#e_step').value;
      try { await API.updateInbox(r.id, f); if (andApprove) await API.approve([r.id]); dlg.close(); toast(andApprove ? 'บันทึกและอนุมัติแล้ว' : 'บันทึกแล้ว'); this.loadInbox(); }
      catch (e) { toast('ผิดพลาด: ' + e.message); }
    };
    $('#e_s').onclick = () => save(false); $('#e_sa').onclick = () => save(true);
  },
  confirm(msg){ return new Promise(res => {
    $('#dlgBody').innerHTML = `<h3>${esc(msg)}</h3><div class="acts"><button class="btn ghost" id="c_n">ยกเลิก</button><button class="btn ok" id="c_y">ยืนยัน</button></div>`;
    const d = $('#dlg'); d.showModal(); $('#c_n').onclick = () => { d.close(); res(false); }; $('#c_y').onclick = () => { d.close(); res(true); };
  }); },
  prompt(title, ph){ return new Promise(res => {
    $('#dlgBody').innerHTML = `<h3>${esc(title)}</h3><input id="p_v" class="field" placeholder="${esc(ph)}"><div class="acts"><button class="btn ghost" id="p_n">ยกเลิก</button><button class="btn bad" id="p_y">ปฏิเสธ</button></div>`;
    const d = $('#dlg'); d.showModal(); $('#p_v').focus(); $('#p_n').onclick = () => { d.close(); res(null); }; $('#p_y').onclick = () => { d.close(); res($('#p_v').value.trim()); };
  }); },

  /* ----- ติดตามงาน ----- */
  progressPage(){
    $('#page').innerHTML = `<div class="toolbar">
        <input id="ps" class="field" style="max-width:340px;padding:9px 12px" placeholder="ค้นหา JOB / ลูกค้า / สินค้า" value="${esc(this.search)}">
        <label style="font-size:14px;display:flex;gap:6px;align-items:center"><input type="checkbox" id="hc" ${this.hideClosed?'checked':''}> ซ่อนงานที่ปิดแล้ว</label>
        <div class="sp"></div><span class="hint">นับเฉพาะยอดที่อนุมัติแล้ว</span></div>
      <div class="card tbl-wrap" id="pg"><div class="empty">กำลังโหลด…</div></div>`;
    let t; $('#ps').oninput = e => { clearTimeout(t); t = setTimeout(() => { this.search = e.target.value; this.loadProgress(); }, 300); };
    $('#hc').onchange = e => { this.hideClosed = e.target.checked; this.loadProgress(); };
    this.loadProgress();
  },
  async loadProgress(){
    let rows;
    try { rows = await API.progress(this.search, this.hideClosed); } catch (e) { $('#pg').innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
    if (USE_DEMO) { const s = this.search.toLowerCase(); rows = rows.filter(r => (!this.hideClosed || !r.closed) && (!s || (r.job_ticket+r.customer_name+r.product_name).toLowerCase().includes(s))); }
    const bar = (v, o, cls='') => o ? `<div class="bar ${cls}"><i style="width:${Math.min(100, v/o*100)}%"></i></div>` : '';
    $('#pg').innerHTML = rows.length ? `<table><thead><tr><th>JOB</th><th>ลูกค้า / สินค้า</th><th class="num">ยอดสั่ง</th><th class="num">พิมพ์</th><th class="num">ไดคัท</th><th class="num">QC</th><th>สถานะผลิตล่าสุด</th><th>QC ล่าสุด</th><th>รอตรวจ</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td><b>${esc(r.job_ticket)}</b>${r.closed ? '<div class="prodname">ปิดแล้ว</div>' : ''}</td>
        <td>${esc(r.customer_name)}<div class="prodname">${esc(r.product_name)}</div></td>
        <td class="num">${fmtN(r.order_qty)}</td>
        <td class="num">${fmtN(r.print_qty)}${bar(r.print_qty, r.order_qty)}</td>
        <td class="num">${fmtN(r.diecut_qty)}${bar(r.diecut_qty, r.order_qty)}</td>
        <td class="num">${fmtN(r.qc_qty)}${bar(r.qc_qty, r.order_qty, 'qcb')}</td>
        <td>${esc(r.last_prod_status||'–')}<div class="prodname">${r.last_prod_at ? fmtT(r.last_prod_at) : ''}</div></td>
        <td>${esc(r.last_qc_status||'–')}<div class="prodname">${r.last_qc_at ? fmtT(r.last_qc_at) : ''}</div></td>
        <td>${r.pending_scans ? `<span class="pill pending">${r.pending_scans}</span>` : ''}</td></tr>`).join('')}</tbody></table>` : `<div class="empty">ไม่พบงาน</div>`;
  },

  /* ----- พิมพ์ใบสั่งผลิต (A4 พร้อม QR 2 จุด) ----- */
  qrPage(){
    const base = store.get('vp_base', location.origin + location.pathname);
    $('#page').innerHTML = `<div class="toolbar noprint">
        <input id="qj" class="field" style="max-width:280px;padding:9px 12px" placeholder="เลขที่ JOB เช่น 6910/30" list="jobList" autocomplete="off" value="${esc(store.get('vp_lastjob',''))}">
        <datalist id="jobList"></datalist>
        <button class="btn sm" id="qgo">แสดงใบสั่งผลิต</button><button class="btn ghost sm" id="qprint" disabled>พิมพ์ A4</button>
        <div class="sp"></div>
        <label class="hint">ผู้สั่งงาน <input id="qby" class="field" style="padding:5px 9px;width:120px;display:inline-block" value="${esc(store.get('vp_orderby',''))}"></label>
      </div>
      <div class="hint noprint" style="margin:-4px 0 14px">ลิงก์หน้าเว็บที่ใช้ใน QR: <input id="qbase" class="field" style="padding:5px 9px;font-size:13px;max-width:520px;display:inline-block;width:auto;min-width:300px" value="${esc(base)}"> <small>(ต้องเป็นลิงก์ที่มือถือพนักงานเปิดได้)</small></div>
      <div id="qout" class="tk-scroll"></div>`;
    let t; $('#qj').oninput = e => { clearTimeout(t); t = setTimeout(async () => {
      const list = await API.searchJobs(e.target.value); $('#jobList').innerHTML = list.map(j => `<option value="${esc(j.job_ticket)}">${esc(j.customer_name)} · ${esc(j.product_name)}</option>`).join(''); }, 250); };
    $('#qbase').onchange = e => store.set('vp_base', e.target.value.trim());
    $('#qby').onchange = e => { store.set('vp_orderby', e.target.value.trim()); gen(); };
    $('#qprint').onclick = () => window.print();
    const gen = async () => {
      const job = $('#qj').value.trim(); if (!job) return;
      let wo; try { wo = await API.getWorkOrder(job); } catch (e) { return toast(e.message); }
      if (!wo) { $('#qprint').disabled = true; return toast('ไม่พบ JOB ' + job); }
      store.set('vp_lastjob', wo.job_ticket);
      const b = $('#qbase').value.trim();
      const url = d => `${b}?scan=${d}&job=${encodeURIComponent(wo.job_ticket)}`;
      $('#qout').innerHTML = jobTicketHTML(wo, $('#qby').value.trim());
      ['prod','qc'].forEach(d => new QRCode($('#tkq_' + d), {text: url(d), width: 256, height: 256, correctLevel: QRCode.CorrectLevel.M}));
      $('#qprint').disabled = false;
      if (Office.autoPrint === wo.job_ticket) {   // มาจากปุ่ม "บันทึก + พิมพ์"
        Office.autoPrint = null;
        const back = () => { window.removeEventListener('afterprint', back); store.set('vp_open_job', wo.job_ticket); Office.go('wo'); };
        window.addEventListener('afterprint', back);
        setTimeout(() => window.print(), 400);
      }
    };
    $('#qgo').onclick = gen; $('#qj').onkeydown = e => { if (e.key === 'Enter') gen(); };
    if ($('#qj').value) gen();
  },

  /* ----- พนักงาน ----- */
  async empPage(){
    let list; try { list = await API.employees(); } catch (e) { $('#page').innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
    $('#page').innerHTML = `<div class="emp-grid">${['prod','qc'].map(d => `<div class="card">
        <div style="padding:14px;display:flex;justify-content:space-between;align-items:center"><b>${DEPT[d].title}</b><span class="pill ${d}">${list.filter(e=>e.dept===d&&e.active).length} คน</span></div>
        ${list.filter(e => e.dept === d).map(e => `<div class="emp-row ${e.active?'':'off'}"><span>${esc(e.name)}</span><button class="btn ghost sm" data-id="${e.id}" data-on="${e.active?1:0}">${e.active?'ซ่อน':'ใช้งาน'}</button></div>`).join('')}
        <div class="emp-row"><input class="field" style="padding:8px 10px" placeholder="เพิ่มชื่อ" id="add_${d}"><button class="btn sm" style="margin-left:8px" data-add="${d}">เพิ่ม</button></div></div>`).join('')}</div>
      <div class="hint" style="margin-top:12px">ชื่อที่ซ่อนจะไม่แสดงในหน้าสแกน แต่ประวัติเดิมยังอยู่</div>`;
    document.querySelectorAll('[data-id]').forEach(b => b.onclick = async () => { await API.toggleEmployee(+b.dataset.id, b.dataset.on !== '1'); this.empPage(); });
    document.querySelectorAll('[data-add]').forEach(b => b.onclick = async () => { const v = $('#add_' + b.dataset.add).value.trim(); if (!v) return; try { await API.addEmployee(v, b.dataset.add); this.empPage(); } catch (e) { toast(e.message); } });
  }
};

/* ================== Start ================== */
if (scanDept === 'prod' || scanDept === 'qc') renderScan(scanDept, params.get('job'));
else Office.start();
</script>
</body>
</html>
