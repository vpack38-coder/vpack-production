        ${rows.map(r => `<tr><td class="cu">${esc(r.customer_name)}</td><td class="pn">${esc(r.product_name)}</td><td class="num">${fmtN(r.prod_total)}</td><td class="num">${fmtN(r.qc_total)}</td>
          <td class="num">${fmtN(r.waste_total)}</td><td class="num">${fmtN(r.order_total)}</td><td class="num">${fmtN(r.open_order_qty || 0)}</td><td>${esc(r.last_status||'')}</td>
          <td class="num ${+r.stock_qty > 0 ? 'stock-pos' : +r.stock_qty < 0 ? 'stock-neg' : ''}"><b>${fmtN(r.stock_qty)}</b></td><td class="pn">${esc(r.stock_jobs||'')}</td></tr>`).join('')}</tbody></table>` : `<div class="empty">ไม่พบข้อมูล</div>`;
      return;
    }
    let rows;
    try { rows = await API.progress(this.search, this.hideClosed, this.onlyStock); } catch (e) { $('#pg').innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
    rows = rows.filter(r => match(r) && (!this.hideClosed || (!r.closed && !r.cancelled)) && (!this.onlyStock || +r.stock_qty !== 0));
    this.prow = rows;
    this.drawProgress();
  },
  PCOLS: [ // [key, หัวคอลัมน์, ชนิด, แถบสี]
    ['job_ticket','JOB','job','b-job'], ['customer_name','ลูกค้า','cu','b-info'], ['product_name','สินค้า','pn','b-info'],
    ['order_qty','ยอดสั่งผลิต','num','b-ord'], ['print_status','สถานะผลิต','st','b-st'], ['diecut_status','สถานะไดคัท','st','b-st'], ['qc_status','ผลตรวจ QC','st','b-st'],
    ['prod_qty','จำนวนผลิต','num','b-qty'], ['qc_qty','ผ่าน QC','num','b-qty'], ['adj_prod_qty','ยอดผลิตปรับปรุง','ed','b-inp'], ['adj_qc_qty','ยอด QC ปรับปรุง','ed','b-inp'],
    ['waste_qty','ของเสีย','num','b-waste'], ['waste_pct','%เสีย','pct','b-waste'], ['carry_forward_qty','ยอดยกมา','ed','b-carry'], ['ready_qty','พร้อมส่ง','num','b-ready'],
    ['backlog_qty','ค้างส่ง','num','b-back'], ['reduce_qty','ปรับลด/ปิดยอด','ed','b-inp'], ['closed','ปิดจ๊อบ','chk','b-close'], ['stock_cut_qty','ตัดสต็อก','ed','b-cut'],
    ['stock_qty','คงคลัง','num','b-stock'], ['stock_total','สต็อกรวม','num','b-stock2'], ['machine','เครื่องพิมพ์','txt','b-man'], ['printer','ช่างพิมพ์','txt','b-man'],
    ['diecutter','ช่างไดคัท','txt','b-man'], ['track_note','หมายเหตุ','ed','b-note'], ['paper_code','รหัสกระดาษ','txt','b-paper'], ['paper_type','ประเภทกระดาษ','txt','b-paper'],
    ['pending_scans','รอตรวจ','num','b-pend']],
  pdisp(r, k, t){ const v = r[k];
    if (t === 'chk') return v ? 'ปิดแล้ว' : 'ยังไม่ปิด';
    if (t === 'pct') return ((+v || 0) * 100).toFixed(2) + '%';
    if (t === 'num' || (t === 'ed' && k !== 'track_note')) return v === null || v === undefined || v === '' ? '' : Number(v).toLocaleString('en-US', {maximumFractionDigits: 3});
    return v === null || v === undefined ? '' : String(v); },
  pFiltered(skip){
    const T = Object.fromEntries(this.PCOLS.map(c => [c[0], c[2]]));
    let rows = (this.prow || []).filter(r => Object.entries(this.pfil || {}).every(([k, set]) => k === skip || set.has(this.pdisp(r, k, T[k]))));
    if (this.psort) { const {k, dir} = this.psort, t = T[k];
      rows = [...rows].sort((a, b) => { const x = a[k], y = b[k];
        if (['num','ed','pct'].includes(t) && k !== 'track_note') return ((x === null || x === '' ? -Infinity : +x) - (y === null || y === '' ? -Infinity : +y)) * dir;
        if (t === 'chk') return ((x ? 1 : 0) - (y ? 1 : 0)) * dir;
        return String(x ?? '').localeCompare(String(y ?? ''), 'th', {numeric: true}) * dir; }); }
    return rows; },
  drawProgress(){
    this.pfil ||= {};
    const rows = this.pFiltered(), C = this.PCOLS;
    const stc = v => /ปั๊มเปล่า/.test(v) ? 'c-ok2' : /เสร็จ|จบ JOB/.test(v) ? 'c-ok' : /กำลัง|ทยอย|ส่ง QC|ปรู๊ฟ/.test(v) ? 'c-run' : /ยังไม่เริ่ม/.test(v) ? 'c-no' : '';
    const ed = (r, c) => `<input class="ed" data-j="${esc(r.job_ticket)}" data-f="${c}" value="${r[c] === null || r[c] === undefined ? '' : (c === 'track_note' ? esc(r[c]) : fmtN(r[c]))}" ${c === 'track_note' ? '' : 'inputmode="decimal"'}>`;
    const cell = (r, [k, , t, band]) => {
      const num = ['num','pct'].includes(t) || (t === 'ed' && k !== 'track_note') ? ' num' : '';
      if (t === 'job') return `<td class="stk ${band}"><a href="#" class="jl" data-open="${esc(r.job_ticket)}">${esc(r.job_ticket)}</a>${r.cancelled ? '<div class="cx-b" title="' + esc(r.cancel_reason || '') + '">ยกเลิก</div>' : ''}</td>`;
      if (t === 'cu' || t === 'pn') return `<td class="${t} ${band}">${esc(r[k])}</td>`;
      if (t === 'st') return `<td class="${band} ${stc(r[k] || '')}">${esc(r[k] || '')}</td>`;
      if (t === 'ed') return `<td class="${band}${num}">${ed(r, k)}</td>`;
      if (t === 'chk') return `<td class="${band}" style="text-align:center"><input type="checkbox" class="edc" data-j="${esc(r.job_ticket)}" ${r.closed ? 'checked' : ''}></td>`;
      if (k === 'pending_scans') return `<td class="${band}">${r.pending_scans ? `<span class="pill pending">${r.pending_scans}</span>` : ''}</td>`;
      if (k === 'stock_qty') return `<td class="${band} num ${+r[k] < 0 ? 'stock-neg' : ''}"><b>${fmtN(r[k])}</b></td>`;
      if (k === 'ready_qty') return `<td class="${band} num"><b>${fmtN(r[k])}</b></td>`;
      if (k === 'backlog_qty') return `<td class="${band} num ${+r[k] > 0 ? 'back-on' : ''}">${fmtN(r[k])}</td>`;
      if (k === 'waste_qty') return `<td class="${band} num ${+r[k] < 0 ? 'stock-neg' : ''}">${fmtN(r[k])}</td>`;
      if (t === 'pct') return `<td class="${band} num">${this.pdisp(r, k, t)}</td>`;
      if (t === 'num') return `<td class="${band} num">${fmtN(r[k])}</td>`;
      return `<td class="${band}">${esc(r[k] || (['machine','printer','diecutter'].includes(k) ? '-' : ''))}</td>`; };
    const nf = Object.keys(this.pfil).length;
    $('#pg').innerHTML = `${nf || this.psort ? `<div class="pf-bar">กรองอยู่ ${nf} คอลัมน์ · แสดง ${fmtN(rows.length)} จาก ${fmtN(this.prow.length)} JOB <button class="btn ghost sm" id="pfClr">ล้างตัวกรองทั้งหมด</button></div>` : ''}
      <table class="trk xl"><thead><tr>${C.map(([k, l, t]) => `<th class="${t === 'job' ? 'stk' : ''} ${t === 'ed' || t === 'chk' ? 'inp' : ''} ${this.pfil[k] ? 'f-on' : ''}"><div class="h"><span>${l}${this.psort?.k === k ? (this.psort.dir > 0 ? ' ▲' : ' ▼') : ''}</span><button class="fb" data-pf="${k}" title="กรอง / เรียง">${this.pfil[k] ? '⧩' : '▼'}</button></div></th>`).join('')}</tr></thead>
      <tbody>${rows.map(r => `<tr class="${r.closed ? 'is-closed' : ''} ${r.cancelled ? 'is-cancel' : ''}">${C.map(c => cell(r, c)).join('')}</tr>`).join('')}</tbody></table>
      ${rows.length ? '' : '<div class="empty">ไม่พบงาน</div>'}`;
    $('#pfClr')?.addEventListener('click', () => { this.pfil = {}; this.psort = null; this.drawProgress(); });
    $('#pg').querySelectorAll('[data-pf]').forEach(b => b.onclick = e => { e.stopPropagation(); const k = b.dataset.pf, col = C.find(c => c[0] === k);
      ColFilter.pop({btn: b, label: col[1], type: ['num','ed','pct'].includes(col[2]) && k !== 'track_note' ? 'numeric' : 'text',
        values: this.pFiltered(k).map(r => this.pdisp(r, k, col[2])), current: this.pfil[k],
        onSort: dir => { this.psort = {k, dir}; this.drawProgress(); },
        onApply: set => { if (set) this.pfil[k] = set; else delete this.pfil[k]; this.drawProgress(); } }); });
    $('#pg').querySelectorAll('.ed').forEach(el => el.onchange = async () => {
      const f = el.dataset.f; let v = el.value.trim();
      if (f !== 'track_note') { v = v === '' ? null : parseFloat(v.replace(/,/g,'')); if (v !== null && isNaN(v)) { toast('ใส่ตัวเลขเท่านั้น'); return; } }
      else if (v === '') v = null;
      try { await API.updateWorkOrder(el.dataset.j, {[f]: v}); toast('บันทึกแล้ว'); this.loadProgress(); } catch (e) { toast('บันทึกไม่ได้: ' + e.message); }
    });
    $('#pg').querySelectorAll('.edc').forEach(el => el.onchange = async () => {
      try { await API.updateWorkOrder(el.dataset.j, {closed: el.checked}); toast(el.checked ? 'ปิดจ๊อบแล้ว' : 'เปิดจ๊อบแล้ว'); this.loadProgress(); } catch (e) { el.checked = !el.checked; toast(e.message); }
    });
    $('#pg').querySelectorAll('[data-open]').forEach(a => a.onclick = e => { e.preventDefault(); store.set('vp_open_job', a.dataset.open); this.go('wo'); });
  },

  /* ----- พิมพ์ใบสั่งผลิต (A4 พร้อม QR 2 จุด) ----- */
  qrPage(){
    const base = store.get('vp_base', location.origin + location.pathname);
    $('#page').innerHTML = `<div class="toolbar noprint">
        <input id="qj" class="field" style="max-width:280px;padding:9px 12px" placeholder="เลขที่ JOB เช่น 6910/30" list="jobList" autocomplete="off" value="${esc(store.get('vp_lastjob',''))}">

      </div>
      <div class="hint noprint" style="margin:-4px 0 14px">ลิงก์หน้าเว็บที่ใช้ใน QR: <input id="qbase" class="field" style="padding:5px 9px;font-size:13px;max-width:520px;display:inline-block;width:auto;min-width:300px" value="${esc(base)}"> <small>(ต้องเป็นลิงก์ที่มือถือพนักงานเปิดได้)</small></div>
      <div id="qout" class="tk-scroll"></div>`;

      const list = await API.searchJobs(e.target.value); $('#jobList').innerHTML = list.map(j => `<option value="${esc(j.job_ticket)}">${esc(j.customer_name)} · ${esc(j.product_name)}</option>`).join(''); }, 250); };

      const job = $('#qj').value.trim(); if (!job) return;
      let wo; try { wo = await API.getWorkOrder(job); } catch (e) { return toast(e.message); }
      if (!wo) { $('#qprint').disabled = true; return toast('ไม่พบ JOB ' + job); }
      if (wo.cancelled) toast(`⚠ JOB ${wo.job_ticket} ถูกยกเลิกแล้ว — ไม่ควรพิมพ์ส่งฝ่ายผลิต`);
      store.set('vp_lastjob', wo.job_ticket);
      const b = $('#qbase').value.trim();
      const url = d => `${b}?scan=${d}&job=${encodeURIComponent(wo.job_ticket)}`;
      $('#qout').innerHTML = (store.get('vp_tpl', '1') === '2' ? jobTicketHTML2 : jobTicketHTML)(wo, $('#qby').value.trim());
      ['prod','qc'].forEach(d => new QRCode($('#tkq_' + d), {text: url(d), width: 256, height: 256, correctLevel: QRCode.CorrectLevel.M}));
      $('#qprint').disabled = false;
      if (Office.autoPrint === wo.job_ticket) {   // มาจากปุ่ม "บันทึก + พิมพ์"
        Office.autoPrint = null;
        const back = () => { window.removeEventListener('afterprint', back); store.set('vp_open_job', wo.job_ticket); Office.go('wo'); };
        window.addEventListener('afterprint', back);
        setTimeout(() => window.print(), 400);
      }
    };
    const tseg = () => document.querySelectorAll('#tplSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === store.get('vp_tpl', '1')));
    document.querySelectorAll('#tplSeg button').forEach(b => b.onclick = () => { store.set('vp_tpl', b.dataset.v); tseg(); if ($('#qj').value) gen(); });
    tseg();
    $('#qgo').onclick = gen; $('#qj').onkeydown = e => { if (e.key === 'Enter') gen(); };
    if ($('#qj').value) gen();
  },

  /* ----- พนักงาน ----- */
  async empPage(){
    let list; try { list = await API.employees(); } catch (e) { $('#page').innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
    $('#page').innerHTML = `<div class="emp-grid">${['prod','qc'].map(d => { const L = list.filter(e => e.dept === d); return `<div class="card">
        <div style="padding:8px 12px;display:flex;justify-content:space-between;align-items:center"><b style="font-size:14px">${DEPT[d].title}</b><span class="pill ${d}">${L.filter(e => e.active).length} คน</span></div>
        <div class="emp-t tbl-wrap"><table><thead><tr><th style="width:56px">ลำดับ</th><th>ชื่อ - นามสกุล</th><th style="width:90px">สถานะ</th><th style="width:80px"></th></tr></thead><tbody>
        ${L.map((e, i) => `<tr class="${e.active ? '' : 'off'}"><td>${i + 1}</td><td>${esc(e.name)}</td><td>${e.active ? '<span style="color:var(--ok)">ใช้งาน</span>' : '<span style="color:var(--muted)">ซ่อนอยู่</span>'}</td>
          <td><span class="rowact"><button class="btn ghost sm" data-id="${e.id}" data-on="${e.active ? 1 : 0}">${e.active ? 'ซ่อน' : 'ใช้งาน'}</button></span></td></tr>`).join('')}</tbody></table></div>
        <div style="display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line)"><input class="field" style="padding:4px 10px;font-size:13px;height:30px" placeholder="เพิ่มชื่อพนักงาน${d === 'qc' ? ' QC' : 'ผลิต'}" id="add_${d}"><button class="btn sm" data-add="${d}">+ เพิ่ม</button></div></div>`; }).join('')}</div>
      <div class="hint" style="margin-top:10px">ชื่อที่ซ่อนจะไม่แสดงในหน้าสแกน แต่ประวัติเดิมยังอยู่</div>`;
    document.querySelectorAll('[data-id]').forEach(b => b.onclick = async () => { await API.toggleEmployee(+b.dataset.id, b.dataset.on !== '1'); this.empPage(); });
    document.querySelectorAll('[data-add]').forEach(b => b.onclick = async () => { const v = $('#add_' + b.dataset.add).value.trim(); if (!v) return; try { await API.addEmployee(v, b.dataset.add); this.empPage(); } catch (e) { toast(e.message); } });
    document.querySelectorAll('[id^=add_]').forEach(i => i.onkeydown = e => { if (e.key === 'Enter') document.querySelector(`[data-add="${i.id.slice(4)}"]`).click(); });
  }
};

/* ================== Start ================== */
if (scanDept === 'prod' || scanDept === 'qc') renderScan(scanDept, params.get('job'));
else Office.start();
</script>
</body>
